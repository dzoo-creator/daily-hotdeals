    { id: 'travel', label: '여행·호텔', icon: '✈️' },
    { id: 'wish', label: '찜한 딜', icon: '⭐' }
  ];
  var CAT_META = {
    baby:   { label: '육아', icon: '👶', cls: 'baby' },
    living: { label: '생활', icon: '🏠', cls: 'living' },
    food:   { label: '음식', icon: '🍽️', cls: 'food' },
    fashion:{ label: '의류', icon: '👕', cls: 'fashion' },
    travel: { label: '여행·호텔', icon: '✈️', cls: 'travel' }
  };

  var $ = function (id) { return document.getElementById(id); };
  var tabsEl = $('tabs'), chipsEl = $('chips'), listEl = $('list');
  var emptyEl = $('empty'), resultEl = $('resultCount'), resetEl = $('resetFilter');
  var searchEl = $('searchInput'), clearEl = $('clearSearch');
  var sourceEl = $('sourceNote'), toastEl = $('toast');

  var DATA = null;
  var SOURCE = 'fresh';
  var wish = new Set(loadWish());
  var state = { cat: 'all', mall: 'all', q: '' };
  var firstRender = true;
  var toastTimer = null;

  var ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return ESC[c]; });
  }
  function loadWish() {
    try {
      var raw = JSON.parse(localStorage.getItem(WISH_KEY) || '[]');
      return Array.isArray(raw) ? raw.filter(function (x) { return typeof x === 'string'; }) : [];
    } catch (e) { return []; }
  }
  function saveWish() {
    try { localStorage.setItem(WISH_KEY, JSON.stringify(Array.from(wish))); } catch (e) {}
  }
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1900);
  }

  /* ── data ─────────────────────────────── */
  function readFallback() {
    try { return JSON.parse($('fallback-deals').textContent); }
    catch (e) { return { date: '', updatedAt: '', deals: [] }; }
  }
  function normalize(raw) {
    var data = raw && typeof raw === 'object' ? raw : {};
    data.deals = Array.isArray(data.deals) ? data.deals.filter(function (d) {
      return d && typeof d.id === 'string' && typeof d.title === 'string';
    }) : [];
    if (!Array.isArray(data.malls)) data.malls = [];
    return data;
  }
  function fetchData() {
    return fetch('./deals.json?t=' + Date.now(), { cache: 'no-store' }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function (json) {
      var data = normalize(json);
      if (!data.deals.length) throw new Error('empty');
      return data;
    });
  }
  function cachedData() {
    try {
      var raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      var data = normalize(JSON.parse(raw));
      return data.deals.length ? data : null;
    } catch (e) { return null; }
  }
  function saveCache(data) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (e) {}
  }

  function load() {
    return fetchData().then(function (data) {
      DATA = data;
      SOURCE = 'fresh';
      saveCache(data);
    }).catch(function () {
      var cached = cachedData();
      if (cached) { DATA = cached; SOURCE = 'cache'; }
      else { DATA = normalize(readFallback()); SOURCE = 'fallback'; }
    });
  }

  /* ── formatting ───────────────────────── */
  function kstToday() {
    var now = new Date();
    var kst = new Date(now.getTime() + (9 * 60 + now.getTimezoneOffset()) * 60000);
    return kst.toISOString().slice(0, 10);
  }
  function formatDate(iso) {
    var d = new Date(String(iso) + 'T00:00:00+09:00');
    if (isNaN(d.getTime())) return '';
    try {
      return new Intl.DateTimeFormat('ko-KR', {
        year: 'numeric', month: 'long', day: 'numeric', weekday: 'long', timeZone: 'Asia/Seoul'
      }).format(d);
    } catch (e) { return iso; }
  }
  function formatTime(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    try {
      return new Intl.DateTimeFormat('ko-KR', {
        hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Seoul'
      }).format(d);
    } catch (e) { return ''; }
  }

  /* ── header ───────────────────────────── */
  function renderHeader() {
    var dateStr = DATA.date || kstToday();
    $('todayDate').textContent = formatDate(dateStr) || dateStr;
    var time = formatTime(DATA.updatedAt);
    $('updatedAt').textContent = time ? '업데이트 ' + time : '업데이트 시각 미정';

    var counts = {};
    var parts = [];
    DATA.deals.forEach(function (d) {
      if (CAT_META[d.category]) counts[d.category] = (counts[d.category] || 0) + 1;
    });
    Object.keys(CAT_META).forEach(function (k) {
      if (counts[k]) parts.push(CAT_META[k].label + ' ' + counts[k]);
    });
    $('summary').innerHTML = '오늘의 핫딜 <b>' + DATA.deals.length + '</b>건 · ' + parts.join(' · ');

    if (SOURCE === 'fresh') {
      sourceEl.hidden = true;
    } else {
      sourceEl.hidden = false;
      sourceEl.textContent = SOURCE === 'cache'
        ? '저장된 오프라인 데이터를 보여드려요' + (time ? ' · ' + time + ' 기준' : '')
        : '내장된 기본 데이터를 보여드려요 · deals.json을 불러오지 못했어요';
    }
  }

  /* ── controls ─────────────────────────── */
  function buildControls() {
    var mallList = DATA.malls.slice();
    DATA.deals.forEach(function (d) {
      if (d.mall && mallList.indexOf(d.mall) === -1) mallList.push(d.mall);
    });

    tabsEl.innerHTML = CATS.map(function (c) {
      return '<button class="tab" type="button" role="tab" data-cat="' + c.id + '" aria-selected="false">' +
        (c.icon ? '<span class="ico" aria-hidden="true">' + c.icon + '</span>' : '') +
        '<span>' + c.label + '</span><span class="n" data-count="' + c.id + '">0</span></button>';
    }).join('');

    chipsEl.innerHTML = '<button class="chip" type="button" data-mall="all" aria-pressed="true">전체</button>' +
      mallList.map(function (m) {
        return '<button class="chip" type="button" data-mall="' + esc(m) + '" aria-pressed="false">' + esc(m) + '</button>';
      }).join('');
  }

  function countByCat(id) {
    if (id === 'wish') {
      return DATA.deals.filter(function (d) { return wish.has(d.id); }).length;
    }
    if (id === 'all') return DATA.deals.length;
    return DATA.deals.filter(function (d) { return d.category === id; }).length;
  }

  function syncControls() {
    Array.prototype.forEach.call(tabsEl.querySelectorAll('.tab'), function (btn) {
      var id = btn.dataset.cat;
      btn.setAttribute('aria-selected', String(state.cat === id));
      var n = btn.querySelector('[data-count="' + id + '"]');
      if (n) n.textContent = countByCat(id);
    });
    Array.prototype.forEach.call(chipsEl.querySelectorAll('.chip'), function (btn) {
      btn.setAttribute('aria-pressed', String(state.mall === btn.dataset.mall));
    });
  }

  /* ── filter + render ──────────────────── */
  function matches(d) {
    if (state.cat === 'wish') {
      if (!wish.has(d.id)) return false;
    } else if (state.cat !== 'all' && d.category !== state.cat) {
      return false;
    }
    if (state.mall !== 'all' && d.mall !== state.mall) return false;
    if (state.q) {
      var cat = CAT_META[d.category];
      var haystay = [d.title, d.mall, d.tag, d.note, d.brand, cat ? cat.label : '']
        .filter(Boolean).join(' ').toLowerCase();
      if (haystay.indexOf(state.q.toLowerCase()) === -1) return false;
    }
    return true;
  }

  function howtoHTML(d) {
    if (!d.how_to) return '';
    var links = Array.isArray(d.coupon_links) ? d.coupon_links.filter(function (c) {
      return c && c.url;
    }) : [];
    return '<div class="howto">' +
      '<span class="lbl">받는 방법</span>' +
      '<p>' + esc(d.how_to) + '</p>' +
      (links.length
        ? '<div class="coupons">' + links.map(function (c) {
            return '<a class="coupon" href="' + esc(c.url) + '" target="_blank" rel="noopener noreferrer">' +
              '<span aria-hidden="true">🎟️</span>' + esc(c.label || '쿠폰 받기') +
              '<span class="arrow" aria-hidden="true">↗</span></a>';
          }).join('') + '</div>'
        : '') +
    '</div>';
  }

  function cardHTML(d, i) {
    var cat = CAT_META[d.category] || { label: '기타', icon: '🏷️', cls: 'etc' };
    var on = wish.has(d.id);
    var refs = Array.isArray(d.refs) ? d.refs : [];
    var compare = (d.was || refs.length)
      ? '<div class="compare">' +
          (d.was ? '<span class="was">' + esc(d.was) + '</span>' : '') +
          refs.map(function (r) { return '<span class="ref">' + esc(r) + '</span>'; }).join('') +
        '</div>'
      : '';
    var price = d.priceText || (d.price != null ? Number(d.price).toLocaleString('ko-KR') + '원' : '가격 확인');
    var meta = (d.shipping || d.note)
      ? '<div class="meta">' +
          (d.shipping ? '<span class="ship">' + (/무료|로켓/.test(d.shipping) ? '🚚 ' : '📍 ') + esc(d.shipping) + '</span>' : '') +
          (d.note ? '<span class="note">' + esc(d.note) + '</span>' : '') +
        '</div>'
      : '';

    return '<article class="card" data-id="' + esc(d.id) + '" style="--i:' + Math.min(i, 11) + '">' +
      '<div class="card-head">' +
        '<span class="cat cat-' + cat.cls + '">' + cat.icon + ' ' + cat.label + '</span>' +
        '<span class="mall">' + esc(d.mall) + '</span>' +
        (d.tag ? '<span class="tag">' + esc(d.tag) + '</span>' : '') +
        '<button class="wish' + (on ? ' on' : '') + '" type="button" data-wish="' + esc(d.id) + '"' +
          ' aria-pressed="' + on + '" aria-label="' + (on ? '찜 해제' : '찜하기') + '">' +
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.1C8.4 17.3 4.5 14.1 4.5 10.2 4.5 7.6 6.5 5.5 9 5.5c1.4 0 2.6.7 3 1.8.4-1.1 1.6-1.8 3-1.8 2.5 0 4.5 2.1 4.5 4.7 0 3.9-3.9 7.1-7.5 9.9z"/></svg>' +
        '</button>' +
      '</div>' +
      '<h2 class="title">' + esc(d.title) + '</h2>' +
      '<div class="price-line">' +
        '<span class="price' + (d.price == null ? ' event' : '') + '">' + esc(price) + '</span>' +
        (d.unit ? '<span class="unit">' + esc(d.unit) + '</span>' : '') +
      '</div>' +
      compare +
      (d.saving ? '<p class="saving"><span aria-hidden="true">↓</span> ' + esc(d.saving) + '</p>' : '') +
      howtoHTML(d) +
      meta +
      '<a class="buy' + (d.linkType === 'search' ? ' soft' : '') + '" href="' + esc(d.url) + '"' +
        ' target="_blank" rel="noopener noreferrer">' +
        esc(d.linkLabel || (d.mall + '에서 보기')) +
        '<span class="arrow" aria-hidden="true">↗</span>' +
      '</a>' +
    '</article>';
  }

  function render() {
    if (!DATA) return;
    var items = DATA.deals.filter(matches);

    syncControls();

    resultEl.textContent = items.length + '개 딜' +
      (state.mall !== 'all' ? ' · ' + state.mall : '') +
      (state.cat === 'wish' ? ' · 찜한 딜' : '');
    resetEl.hidden = !(state.cat !== 'all' || state.mall !== 'all' || state.q);
    clearEl.hidden = !state.q;

    listEl.innerHTML = items.map(cardHTML).join('');
    if (firstRender) {
      listEl.classList.add('animated');
      setTimeout(function () { listEl.classList.remove('animated'); }, 900);
      firstRender = false;
    }

    emptyEl.hidden = items.length > 0;
    if (items.length === 0) {
      emptyEl.querySelector('h3').textContent = state.cat === 'wish'
        ? '아직 찜한 딜이 없어요'
        : '조건에 맞는 딜이 없어요';
      emptyEl.querySelector('p').textContent = state.cat === 'wish'
        ? '카드 오른쪽 ♥ 를 누르면 여기에 모여요.'
        : '다른 카테고리나 쇼핑몰을 골라 보세요.';
    }
  }

  /* ── events ───────────────────────────── */
  tabsEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.tab');
    if (!btn) return;
    state.cat = btn.dataset.cat;
    render();
  });

  chipsEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.chip');
    if (!btn) return;
    state.mall = btn.dataset.mall;
    render();
  });

  listEl.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-wish]');
    if (!btn) return;
    var id = btn.dataset.wish;
    if (wish.has(id)) {
      wish.delete(id);
      toast('찜에서 뺐어요');
    } else {
      wish.add(id);
      toast('찜한 딜에 담았어요');
    }
    saveWish();
    render();
  });

  searchEl.addEventListener('input', function () {
    state.q = searchEl.value.trim();
    render();
  });
  searchEl.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { searchEl.value = ''; state.q = ''; render(); }
  });
  clearEl.addEventListener('click', function () {
    searchEl.value = '';
    state.q = '';
    searchEl.focus();
    render();
  });
  resetEl.addEventListener('click', function () {
    state.cat = 'all'; state.mall = 'all'; state.q = '';
    searchEl.value = '';
    render();
  });

  $('refreshBtn').addEventListener('click', function () {
    var btn = this;
    if (btn.classList.contains('spin')) return;
    btn.classList.add('spin');
    load().then(function () {
      btn.classList.remove('spin');
      renderHeader();
      buildControls();
      render();
      toast(SOURCE === 'fresh' ? '최신 딜로 업데이트했어요' : '최신 데이터를 받지 못했어요');
    });
  });

  /* ── boot ─────────────────────────────── */
  load().then(function () {
    renderHeader();
    buildControls();
    render();
  });
})();
</script>
</body>
</html>
